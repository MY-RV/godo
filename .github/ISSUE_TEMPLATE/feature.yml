name: Feature request
description: Propose a change within the product cut
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Desired behavior. Check docs/contract.md and docs/roadmap.md first.
    validations:
      required: true
  - type: checkboxes
    id: cut
    attributes:
      label: Scope
      options:
        - label: I checked docs/contract.md and docs/roadmap.md for fit
          required: true
