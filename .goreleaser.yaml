# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: godo

before:
  hooks:
    - go mod tidy

builds:
  - id: godo
    main: ./cmd/godo
    binary: godo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/my-rv/godo.Version={{.Version}}

archives:
  - id: archive
    # Default files are LICENSE*/README*/CHANGELOG*. The binaries statically
    # link Apache-2.0 code (wazero), whose attribution has to ship with them.
    files:
      - LICENSE
      - THIRD_PARTY_LICENSES.md
      - README.md
      - CHANGELOG.md
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
  - id: binary
    formats: [binary]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

# Packaging homes. Both pushes need a PAT with write access to those repos,
# exposed to the release workflow as TAP_GITHUB_TOKEN; without it the release
# still publishes, it just does not update the tap or the bucket.
# Homebrew ships pre-built binaries as casks now; `brews` is deprecated and
# makes `goreleaser check` fail. Casks are macOS-only — Linux installs go
# through `go install` or the release binary (docs/install.md).
homebrew_casks:
  - name: godo
    ids: [archive]
    repository:
      owner: MY-RV
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/MY-RV/godo"
    description: "Thin repo command catalog"
    skip_upload: '{{ if .Env.TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/godo"]
          end

scoops:
  - name: godo
    ids: [archive]
    repository:
      owner: MY-RV
      name: scoop-bucket
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/MY-RV/godo"
    description: "Thin repo command catalog"
    license: "MIT"
    skip_upload: '{{ if .Env.TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
  prerelease: auto
